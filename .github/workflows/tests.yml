name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the README claims, so it gets tested rather
        # than assumed. The newest version catches deprecations early.
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Verify it runs with no install at all
        # The main claim in the README is that a bare clone works with
        # nothing but the standard library. Worth proving on every push.
        run: python spread_audit.py examples/trades.csv --bootstrap 0
