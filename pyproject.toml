[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spread-audit"
version = "1.0.0"
description = "Tells you whether a trading strategy's edge survives its own costs."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Prashanth" }]
keywords = ["trading", "backtest", "spread", "expectancy", "forex", "metatrader", "quant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
# No runtime dependencies, deliberately: the tool is one standard-library
# file so that a fresh clone runs without an install step.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.17,<0.18"]

[project.scripts]
spread-audit = "spread_audit:main"

[tool.setuptools]
py-modules = ["spread_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
